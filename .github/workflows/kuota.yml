name: Pantau kuota Turso

# Pada 10 Sep 2026 akaun Turso disekat SEPENUHNYA — bacaan mencecah 627,991,252
# daripada had 500,000,000 (126%). Tiada siapa perasan sehingga emel tiba.
# Pada pelan percuma, mencecah mana-mana had menyekat seluruh akaun; ia tidak
# diperlahankan. Workflow ini merekod bacaan setiap hari supaya trend kelihatan,
# dan menjadi MERAH pada 90% — bukan pada 100%, kerana ketika itu sudah terlambat.
#
# Rahsia diperlukan: TURSO_API_TOKEN

on:
  schedule:
    # Setiap 3 jam: letusan 23 Okt 2026 (~10 juta bacaan SEJAM) boleh menyekat
    # akaun dalam masa kurang sehari — semakan harian terlalu jarang. Log CSV
    # kekal satu baris sehari (kuota.mjs langkau jika tarikh sudah ada).
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kuota
  cancel-in-progress: false

jobs:
  ukur:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ukur kuota
        id: ukur
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set +e
          node scripts/kuota.mjs --csv docs/kuota-log.csv | tee /tmp/kuota.txt
          echo "kod=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # Jaring keselamatan: hadis baharu (import/sync/seed semula) tanpa seq tidak
      # muncul di muka kitab. Semakan ~5 bacaan; segar hanya jika lapuk. Token DB
      # dijana sendiri dari TURSO_API_TOKEN — tiada rahsia tambahan.
      - name: Segar seq hadis jika lapuk
        id: segar
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
        run: node scripts/segar-seq.mjs --turso --jika-perlu | tee /tmp/segar.txt

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "## Kuota Turso"
            echo '```'
            cat /tmp/kuota.txt 2>/dev/null || echo "tiada output"
            echo '```'
            echo "## Seq hadis"
            echo '```'
            cat /tmp/segar.txt 2>/dev/null || echo "tiada output"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      # Simpan bacaan supaya trend merentas bulan boleh dilihat. [skip ci] +
      # paths-ignore dalam deploy.yml menghalang deploy harian yang sia-sia.
      - name: Catat bacaan
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git diff` TIDAK nampak fail yang belum dijejaki, jadi stage dahulu
          # kemudian banding indeks. Versi pertama lapor "tiada perubahan" pada
          # larian pertama dan langkah ini hijau sambil tidak berbuat apa-apa.
          git add docs/kuota-log.csv
          if git diff --cached --quiet; then
            echo "Tiada perubahan."; exit 0
          fi
          git commit -m "chore: bacaan kuota Turso $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase --autostash -q origin main || true
          git push

      - name: Gagalkan larian jika kritikal
        if: steps.ukur.outputs.kod != '0'
        run: |
          echo "Kuota kritikal — lihat ringkasan di atas."
          exit 1
