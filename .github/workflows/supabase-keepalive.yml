# Keep-alive Supabase (dewan-izhan) — projek free-tier PAUSE selepas ~7 hari tiada
# aktiviti. Cron ini ping REST + Auth 2× sehari (jurang ~12 jam) supaya walaupun
# GitHub lewat/skip beberapa jadual, projek tak sempat cecah 7 hari senyap.
# Guna SECRETS: SUPABASE_URL + SUPABASE_SECRET_KEY (required untuk pass RLS)
name: Supabase keep-alive

on:
  schedule:
    - cron: "23 1 * * *"    # 01:23 UTC = 09:23 MYT
    - cron: "23 13 * * *"   # 13:23 UTC = 21:23 MYT
  workflow_dispatch:
    inputs:
      force_stamp:
        description: "Paksa commit stamp walaupun repo belum sunyi 40 hari"
        type: boolean
        default: false

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Ping Supabase (REST + Auth)
        id: ping
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set +e
          URL="${SUPABASE_URL%/}"
          KEY="${SUPABASE_SECRET_KEY}"
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SECRET_KEY tiada dlm secrets"
            echo "reason=secrets hilang" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Cuba 3× dgn backoff — elak gagal sebab hiccup rangkaian sekejap.
          reason=""
          for attempt in 1 2 3; do
            code=$(curl -s -m 25 -o /tmp/resp.txt -w '%{http_code}' \
              "$URL/rest/v1/correction_suggestions?select=id&limit=1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            cexit=$?

            if [ "$cexit" -ne 0 ]; then
              # 6 = DNS tak resolve → tanda paling kuat projek dah PAUSE.
              case "$cexit" in
                6) reason="DNS tak resolve (curl 6) — projek besar kemungkinan PAUSE" ;;
                7) reason="sambungan ditolak (curl 7)" ;;
                28) reason="timeout (curl 28)" ;;
                *) reason="curl gagal exit $cexit" ;;
              esac
              echo "cubaan $attempt: $reason"
            elif [ "$code" = "200" ]; then
              echo "✓ REST 200 — Supabase aktif"
              # Ping kedua: Auth (GoTrue) supaya bukan PostgREST je yg tersentuh.
              acode=$(curl -s -m 25 -o /dev/null -w '%{http_code}' \
                "$URL/auth/v1/health" -H "apikey: $KEY")
              echo "auth/v1/health → HTTP ${acode:-n/a}"
              exit 0
            else
              reason="REST balas HTTP $code"
              echo "cubaan $attempt: $reason"
              head -c 300 /tmp/resp.txt; echo
            fi

            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done

          echo "::error::Keep-alive GAGAL — $reason"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Bangkitkan isu bila gagal
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.ping.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Satu isu terbuka sahaja — elak spam setiap 12 jam.
          existing=$(gh issue list --label supabase-keepalive --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Masih gagal ($REASON) — $RUN_URL"
            exit 0
          fi
          gh label create supabase-keepalive --color B60205 \
            --description "Keep-alive Supabase gagal" 2>/dev/null || true
          cat > /tmp/body.md <<EOF
          Sebab: ${REASON:-tidak diketahui}

          Log: $RUN_URL

          Kalau sebabnya DNS/curl 6 → projek dah PAUSE. Ping **tak boleh**
          bangunkan projek yang dah pause; kena tekan **Restore** di Supabase
          dashboard dulu, kemudian jalankan semula workflow ini.

          Tutup isu ini bila projek dah aktif semula.
          EOF
          sed -i 's/^          //' /tmp/body.md
          gh issue create --label supabase-keepalive \
            --title "⚠️ Supabase keep-alive gagal" --body-file /tmp/body.md

  # GitHub auto-disable workflow berjadual dlm repo public selepas 60 hari repo
  # tiada commit. Job ini commit satu stamp bila repo dah sunyi >40 hari — cukup
  # untuk reset kiraan, tanpa mengotorkan sejarah dgn commit harian.
  # Berasingan dari job `ping`: kena tetap jalan walaupun Supabase sedang pause.
  stamp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Commit stamp kalau repo dah lama sunyi
        shell: bash
        env:
          FORCE: ${{ inputs.force_stamp }}
        run: |
          set -euo pipefail
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Commit terakhir: $age hari lepas (ambang: 40, force=${FORCE:-false})"
          if [ "$age" -lt 40 ] && [ "${FORCE:-false}" != "true" ]; then
            echo "Belum perlu stamp."
            exit 0
          fi

          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive-stamp
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive-stamp
          # [skip ci] — lapisan kedua; push guna GITHUB_TOKEN pun dah tak
          # trigger workflow lain (deploy.yml), ini cuma jaring keselamatan.
          git commit -m "chore(ci): stamp keep-alive — elak auto-disable cron [skip ci]"
          git push || { git pull --rebase && git push; }
          echo "✓ Stamp di-commit — kiraan 60 hari reset."
