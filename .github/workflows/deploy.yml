# Auto-deploy Dewan Izhan → Cloudflare Worker bila push ke main.
# Setara "Workers Builds" tapi guna GitHub Actions (boleh push dari Claude Code cloud).
# Secrets/vars repo: CLOUDFLARE_API_TOKEN (secret); NEXT_PUBLIC_SUPABASE_URL,
# NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, CLOUDFLARE_ACCOUNT_ID (vars).
# Rahsia runtime worker (TURSO_*, SUPABASE_SECRET_KEY, ADMIN_PASSWORD) kekal di CF
# (di-set via `wrangler secret put`) — deploy tak mengubahnya.
name: Deploy ke Cloudflare

on:
  push:
    branches: [main]
    # Log kuota ditulis setiap hari oleh kuota.yml — ia tidak mengubah apa-apa
    # yang di-deploy, jadi jangan cetuskan deploy harian yang sia-sia.
    paths-ignore:
      - "docs/kuota-log.csv"
  workflow_dispatch:

concurrency:
  group: deploy-cf
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cap jari murah (~13 baca baris Turso): aset statik dijana semula HANYA bila data/penjana berubah.
      - name: Static fingerprint
        id: static
        run: node scripts/static-fingerprint.mjs
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
      - name: Static assets cache
        uses: actions/cache@v4
        with:
          path: .static-cache
          key: static-${{ steps.static.outputs.fp }}
      - name: Build (OpenNext)
        run: npm run cf:build
        env:
          STATIC_FP: ${{ steps.static.outputs.fp }}
          STATIC_CACHE_DIR: .static-cache
          # Penjana halaman kitab statik membaca korpus terus dari Turso (tiada data/corpus.db di CI).
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Deploy (wrangler)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
